<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Pencatatan Anggaran</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <h1>Aplikasi Pencatatan Anggaran</h1>
        <p>Catat pemasukan dan pengeluaran, lalu cetak laporan anggaran secara detail.</p>
    </header>

    <section class="summary-section">
        <div class="summary-card income">
            <h3>Total Pemasukan</h3>
            <p id="totalIncome">Rp 0</p>
        </div>

        <div class="summary-card expense">
            <h3>Total Pengeluaran</h3>
            <p id="totalExpense">Rp 0</p>
        </div>

        <div class="summary-card balance">
            <h3>Sisa Saldo</h3>
            <p id="balance">Rp 0</p>
        </div>
    </section>

    <section class="form-section no-print">
        <h2>Tambah Catatan Anggaran</h2>

        <form id="budgetForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="date">Tanggal</label>
                    <input type="date" id="date" required />
                </div>

                <div class="form-group">
                    <label for="type">Jenis Transaksi</label>
                    <select id="type" required>
                        <option value="">Pilih jenis</option>
                        <option value="income">Pemasukan</option>
                        <option value="expense">Pengeluaran</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="category">Kategori</label>
                    <input type="text" id="category" placeholder="Contoh: Gaji, Makan, Transport" required />
                </div>

                <div class="form-group">
                    <label for="amount">Jumlah Rupiah</label>
                    <input type="number" id="amount" placeholder="Contoh: 50000" min="1" required />
                </div>
            </div>

            <div class="form-group">
                <label for="description">Keterangan</label>
                <textarea id="description" placeholder="Tuliskan detail transaksi..." rows="3"></textarea>
            </div>

            <button type="submit" class="btn-primary">Tambah Catatan</button>
        </form>
    </section>

    <section class="table-section">
        <div class="table-header">
            <div>
                <h2>Laporan Detail Anggaran</h2>
                <p id="printDate"></p>
            </div>

            <div class="button-group no-print">
                <button onclick="printReport()" class="btn-print">Print Laporan</button>
                <button onclick="clearAllData()" class="btn-danger">Hapus Semua</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>No</th>
                    <th>Tanggal</th>
                    <th>Jenis</th>
                    <th>Kategori</th>
                    <th>Jumlah</th>
                    <th>Keterangan</th>
                    <th class="no-print">Aksi</th>
                </tr>
                </thead>
                <tbody id="budgetTableBody">
                <!-- Data transaksi akan muncul di sini -->
                </tbody>
            </table>
        </div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
